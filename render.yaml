services:
  - type: web
    name: keja-connect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py ensure_keja_schema && python manage.py migrate --noinput && python manage.py seed_counties
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: KEJACONNECT_DEBUG
        value: "False"
      - key: KEJACONNECT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elegance-salon-db
          property: connectionString
      - key: KEJACONNECT_MEDIA_ROOT
        value: /tmp/keja-connect-media
